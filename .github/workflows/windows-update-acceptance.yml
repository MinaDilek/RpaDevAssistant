name: Windows Installed Update Acceptance

on:
  workflow_dispatch:
    inputs:
      from_tag:
        description: Previously installed release tag
        required: true
        default: v0.1.2
      to_tag:
        description: Release tag to install as the update
        required: true

permissions:
  contents: read

jobs:
  installed-upgrade:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed installed update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/Test-WindowsInstalledUpdate.ps1 `
            -FromTag "${{ inputs.from_tag }}" `
            -ToTag "${{ inputs.to_tag }}" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -WorkingRoot "$env:RUNNER_TEMP\installed-update"
