name: Windows Desktop Release

on:
  workflow_dispatch:
    inputs:
      acceptance_from_tag:
        description: Previously installed release used by the upgrade acceptance job
        required: true
        default: v0.1.2
      acceptance_to_tag:
        description: Target release used by the upgrade acceptance job
        required: true
        default: v0.1.3
  push:
    branches:
      - "codex/windows-installer-validation-*"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-nsis:
    runs-on: windows-2022
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Validate backend
        run: |
          dotnet restore RpaDevAssistant.sln
          dotnet build RpaDevAssistant.sln --configuration Release --no-restore
          dotnet test RpaDevAssistant.sln --configuration Release --no-build

      - name: Test frontend
        run: npm run frontend:test

      - name: Build frontend
        run: npm run frontend:build

      - name: Publish backend sidecar
        run: npm run backend:publish:win

      - name: Build NSIS installer
        run: npm run tauri:build --workspace frontend -- --config src-tauri/tauri.updater.conf.json

      - name: Require Authenticode certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "Tagged production releases require WINDOWS_CERTIFICATE_BASE64 and WINDOWS_CERTIFICATE_PASSWORD."
          }

      - name: Sign installer when certificate is configured
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "rpadevassistant-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }
          & signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificatePath /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE." }
          Remove-Item $certificatePath -Force

          Push-Location frontend
          try {
            npm exec tauri signer sign -- $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Tauri updater re-signing failed with exit code $LASTEXITCODE." }
          }
          finally {
            Pop-Location
          }

      - name: Create signed updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/create-update-manifest.mjs

      - name: Verify release artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer -or $installer.Length -le 0) { throw "A non-empty NSIS installer was not produced." }
          Write-Host "Installer: $($installer.FullName) ($($installer.Length) bytes)"

      - name: Verify Authenticode signature and timestamp
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "Installer Authenticode signature is $($signature.Status)." }
          if (-not $signature.SignerCertificate) { throw "Installer does not contain a signing certificate." }
          if (-not $signature.TimeStamperCertificate) { throw "Installer signature does not contain a trusted timestamp." }

      - name: Smoke test NSIS installation
        shell: pwsh
        run: |
          $installer = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced." }

          $installDirectory = Join-Path $env:RUNNER_TEMP "RpaDevAssistantInstall"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installDirectory" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($install.ExitCode)." }

          $desktopExecutable = Join-Path $installDirectory "rpadevassistant-desktop.exe"
          if (-not (Test-Path $desktopExecutable)) {
            throw "Desktop executable was not installed at $desktopExecutable."
          }

          $installedSidecar = Get-ChildItem $installDirectory -Recurse -Filter "RpaDevAssistant.Api*.exe" | Select-Object -First 1
          if (-not $installedSidecar) { throw "The bundled .NET backend sidecar was not installed." }

          Write-Host "Installed desktop executable: $desktopExecutable"
          Write-Host "Installed backend sidecar: $($installedSidecar.FullName)"

      - uses: actions/upload-artifact@v4
        with:
          name: rpa-dev-assistant-windows-nsis
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release update assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis" | Where-Object { $_.Name -eq "latest.json" -or $_.Name -like "*.nsis.zip" -or $_.Name -like "*.nsis.zip.sig" -or $_.Name -like "*-setup.exe" -or $_.Name -like "*-setup.exe.sig" }
          if (-not $assets) { throw "No updater release assets were produced." }
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "RPA Dev Assistant $env:GITHUB_REF_NAME" --generate-notes }
          gh release upload $env:GITHUB_REF_NAME @($assets.FullName) --clobber

  installed-update-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Validate signed installed update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          ./scripts/Test-WindowsInstalledUpdate.ps1 `
            -FromTag "${{ inputs.acceptance_from_tag }}" `
            -ToTag "${{ inputs.acceptance_to_tag }}" `
            -Repository "$env:GITHUB_REPOSITORY" `
            -WorkingRoot "$env:RUNNER_TEMP\installed-update"
