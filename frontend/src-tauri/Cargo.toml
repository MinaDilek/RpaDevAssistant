[package]
name = "rpadevassistant-desktop"
version = "0.1.0"
description = "RPA Dev Assistant desktop shell"
authors = ["RPA Dev Assistant"]
edition = "2021"

[lib]
name = "rpadevassistant_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1.0.151"
